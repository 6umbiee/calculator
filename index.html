<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <audio src="ungol-prank-made-with-Voicemod.mp3"></audio>
  <div class="main">
    <input class="display" type="text" readonly>
    <div id="buttons">
      <button class="operators" onclick="input('+')">+</button>
      <button class="numbers" onclick="input(1)">1</button>
      <button class="numbers" onclick="input(2)">2</button>
      <button class="numbers" onclick="input(3)">3</button>
      <button class="operators" onclick="input('-')">-</button>
      <button class="numbers" onclick="input(4)">4</button>
      <button class="numbers" onclick="input(5)">5</button>
      <button class="numbers" onclick="input(6)">6</button>
      <button class="operators" onclick="input('*')">*</button>
      <button class="numbers" onclick="input(7)">7</button>
      <button class="numbers" onclick="input(8)">8</button>
      <button class="numbers" onclick="input(9)">9</button>
      <button class="operators" onclick="input('/')">/</button>
      <button class="clear" onclick="cleardisplay()">clear</button>
      <button class="numbers" onclick="input(0)">0</button>
      <button class="equal" onclick="equal()">=</button>
    </div>
  </div>
</body>
<script src="script.js"></script>

</html>
